.videobox{position:relative;width:100%;padding-top:62%;background:#111;border-radius:12px;overflow:hidden}
.videobox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

  { id:"s1", kind:"真实案例 · 公开报道", icon:"chat", title:"徐梦桃：切除六成半月板的膝盖，跳成了奥运冠军",
    meta:"自由式滑雪空中技巧 · 2016 年前交叉韧带断裂 · 五战冬奥",
    quote:"「每一次康复训练，我都告诫自己，只要还能站起来，我一定要重返赛场。」——徐梦桃自传",
    body:[
      "2016 年初的全国冬运会，徐梦桃挑战向后翻腾三周失败，重重摔在雪地上。诊断结果是一连串的：左膝前交叉韧带完全断裂、内侧副韧带扭伤、半月板损伤、多发骨挫伤。手术切除了她左膝外侧半月板的约六成，医生不止一次告诉她：这样的膝盖，运动生涯可能到此为止了。",
      "那是她运动生涯里最暗的一段日子。坐在轮椅上的无助，恢复训练时钻心的疼，深夜里反复问自己「还练吗？坚持，还是不坚持？」外界也有声音说，她或许就是「亚军命」。换作很多人，可能就体面退场了。",

      "也是从那次受伤开始，她养成了写日记的习惯。她说：「不是成功的人才值得去挖掘背后的东西，即使不成功，我也要记录自己的故事。」写着写着，她想明白了一件事：荣誉不是今天想、明天就会到的东西，把每一天做好、每一天去努力，就够了。",
      "九个月后，她在阿尔卑斯山完成了术后第一堂雪上跳台训练，成功做出高难度的三周台动作。完成的那一刻，她仰天长啸——那是向所有人宣告：我回来了。",

    ],

    body:[
      "从 2012 年起，伤病就没离开过隋文静：韧带松弛、骨骺炎，让她很难完成高难度动作。2016 年 4 月的波士顿世锦赛，她带着伤拿下双人滑亚军，场边的队医忍不住落泪：「换做一般人，这种程度的伤早就不能走路了。」",
      "2016 年 5 月 5 日，她躺上手术台，接受右侧脚踝外侧副韧带重建和左侧脚踝肌腱复位手术。手术持续近四个小时，因为是半麻醉，她清晰地感觉到整个过程。醒来后，两只脚被包扎得像「阿童木」，任何一次下意识的抬脚都会让疼痛变本加厉。术后 72 小时是极限疼痛，她只能靠止疼针每天睡上两三个小时，在微博上写下四个字：「大写的疼」。",
      "她在床上躺了将近三个月，长期卧床让她失去了全部的肌肉力量，连站立都要从零开始。「天都灰了。」她真的怀疑过，自己是不是要彻底离开冰场了。",
      "那段时间，搭档韩聪一个人训练，练完男伴的计划再练女伴的，训练结束就去医院陪她。2016 年 7 月的「冰上盛典」，韩聪独自滑了一套「双人滑」：一个人的捻转，一个人的托举，他把双臂伸向空气，稳稳托起一片虚无。表演最后，他推着坐在轮椅上的隋文静来到冰场中央。她哭着向观众挥手——那一刻，她觉得自己离冰场又近了一步。",
      "康复是从重新学走路开始的，每迈出一步都像人生的第一步。第一次回到冰上，医生只给了她十分钟，她滑了十五分钟，「笑得像一百斤的胖子」。",

  { id:"s3", kind:"真实案例 · 同龄人", icon:"chat", title:"14 岁泰拳少年小陈：被建议「等两年」，他没有放弃赛场梦",
    meta:"小陈（化名）· 14 岁 · 澳门 · 前交叉韧带断裂 · 2026 年公开报道",
    quote:"「没想到手术这么快，恢复也这么顺利，做完一天就能下地。」——小陈家人",
    body:[
      "14 岁的小陈（化名）来自澳门，是个浑身是劲的泰拳爱好者。平日里他泡在训练场，满心都是走上赛场拼搏的梦想。",
      "一场意外让这份热情戛然而止：打球时他不小心扭伤右膝，当场疼得站不住，膝盖肿得像馒头。在当地医院处理后，膝盖还是不稳当，别说训练，连正常走路都受影响。",
      "检查结果确认了前交叉韧带断裂。但因为他才 14 岁、骨骼还没发育成熟，当地医生建议等 16 岁骨骺闭合后再手术。这意味着要暂停训练整整两年——对正处在技术上升关键期的他来说，几乎是断了赛场的希望。那段时间，全家人都跟着着急。",
      "不想让孩子的梦想就此搁浅，家人四处打听，了解到暨南大学附属第一医院运动医学科李劼若主任团队在青少年韧带损伤治疗方面经验丰富，便带着小陈专程从澳门赶到广州。",
      "团队没有只凭年龄判断。他们为小陈做了全面检查，结合骨龄评估和他泰拳运动的特殊需求，制定了个性化方案：用他自己的肌腱作为移植物，配合 OTT（越顶位）重建技术，在关节镜下完成韧带重建——精准避开生长板区域，既保证重建韧带牢固，又不影响后续长高。",
      "术后第一天，小陈就能在医护人员指导下戴着护具、拄着拐杖下地走路，并开始简单的康复训练；术后第五天，他顺利出院。家人感慨恢复之快，而小陈心里重新燃起的，是重返赛场的希望。",
      "回头看，最煎熬的其实不是疼痛，而是「要等两年」那种梦想被悬置的感觉。帮到他的，是家人没有放弃他的梦想、愿意陪他跨城求医，也是医生把他的运动目标当回事，认真为他想办法。"
    ],
    helped:["青少年受伤不等于「只能等长大」，可以找运动医学科评估第二方案","把自己的运动目标告诉医生，康复方案可以个性化","家人「一起想办法」本身，就是给孩子最重要的心理支持","术后早期科学康复是重返赛场的关键，不是躺着静养等它好"],

function trend() {
  var data = S.entries.slice(0, 7).reverse(), n = data.length;
  function x(i) { return 26 + i * 266 / Math.max(n - 1, 1); }
  function y(v) { return 100 - v * 9; }
  function line(k) { return data.map(function (e, i) { return x(i) + "," + y(e[k]); }).join(" "); }
  var s = '<svg viewBox="0 0 300 126" style="width:100%">';
  [0, 5, 10].forEach(function (v) {
    s += '<line x1="26" x2="292" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#E5E1D8" stroke-width="1"'+(v ? ' stroke-dasharray="3 4"' : '')+'/>';
    s += '<text x="20" y="'+(y(v)+3)+'" font-size="8" fill="#8A9BA3" text-anchor="end">'+v+'</text>';
  });
  s += '<polyline points="'+line("worry")+'" fill="none" stroke="#E9A23B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  s += '<polyline points="'+line("confidence")+'" fill="none" stroke="#3BA55D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  data.forEach(function (e, i) {
    s += '<circle cx="'+x(i)+'" cy="'+y(e.confidence)+'" r="2.6" fill="#3BA55D"/><circle cx="'+x(i)+'" cy="'+y(e.worry)+'" r="2.6" fill="#E9A23B"/>';
    s += '<text x="'+x(i)+'" y="116" font-size="8" fill="#8A9BA3" text-anchor="middle">'+esc(e.date)+'</text>';
  });
  return s + "</svg>";
}

    });
    h += '<div class="card" style="background:var(--danger-bg)"><div class="sub" style="color:var(--danger);line-height:1.7">若出现紧急危险（如伤害自己的冲动），请立即告诉身边的大人，拨打 120 / 110，或前往最近的医院急诊。</div></div>';
    h += '<div class="mut">求助不是软弱，而是康复的一部分。</div>';
  }
  return h + "</div>";
}
function viewDetail() {
  var h = '<div class="col fade">';
  if (S.detail.kind === "story") {
    var s = STORIES.filter(function (x) { return x.id === S.detail.id; })[0];
    h += '<div class="row"><span class="chip on" style="cursor:default">'+s.kind+"</span></div>";
    h += '<div class="h">'+s.title+'</div><div class="mut">'+s.meta+'</div><div class="quote">'+s.quote+"</div>";
    s.body.forEach(function (p) { h += '<div class="para">'+esc(p)+"</div>"; });
    h += '<div class="card col"><div class="sub" style="font-weight:700;color:var(--ink)">这段经历里，帮到我的事</div>'+lis(s.helped,"var(--brand)")+"</div>";
    h += '<div class="card col" style="gap:6px"><div class="sub" style="font-weight:700;color:var(--ink)">报道来源</div>';
    s.sources.forEach(function (src) { h += '<a class="src" href="'+src.url+'" target="_blank" rel="noopener">'+esc(src.label)+"</a>"; });
    h += '<div class="mut">案例根据公开报道整理，不构成医疗建议；康复请遵医嘱。</div></div>';
    h += '<button class="btn" data-act="tab" data-arg="journal">看完想记一笔？去记录</button>';
  } else if (S.detail.kind === "video") {
    var v = VIDEOS.filter(function (x) { return x.id === S.detail.id; })[0];
    h += '<div class="row"><span class="chip on" style="cursor:default">视频短片</span></div>';
    h += '<div class="h">'+v.title+'</div><div class="mut">UP 主：'+v.up+" · "+v.dur+" · 来源：哔哩哔哩</div>";
    h += '<div class="videobox"><iframe src="https://player.bilibili.com/player.html?bvid='+v.bvid+'&page=1&autoplay=0&danmaku=0&high_quality=1" allowfullscreen scrolling="no" frameborder="0"></iframe></div>';
    h += '<div class="sub">'+v.intro+"</div>";
    h += '<a class="src" href="https://www.bilibili.com/video/'+v.bvid+'" target="_blank" rel="noopener">播放不了？点这里在 B 站打开 →</a>';
    h += '<div class="mut">视频版权归原作者所有；若限制站外播放，请使用上方链接。科普内容仅供参考，具体康复请遵医嘱。</div>';
  } else if (S.detail.kind === "sit") {
    var sit = SITUATIONS.filter(function (x) { return x.id === S.detail.id; })[0];
    h += '<div class="row"><span class="chip on" style="cursor:default">沟通要点</span></div>';
    h += '<div class="h">'+sit.title+"</div>";
    h += '<div class="card col"><div class="col" style="gap:4px"><span class="mut" style="color:var(--green);font-weight:700">可以这样回应</span>'+lis(sit.dos,"var(--green)")+'</div><div class="col" style="gap:4px"><span class="mut" style="color:var(--danger);font-weight:700">尽量避免</span>'+lis(sit.avoid,"var(--danger)")+'</div><div class="quote">「'+esc(sit.say)+"」</div></div>";
    h += '<button class="btn quiet" data-act="back">回到对话</button>';
  } else {
    var a = ARTICLES.filter(function (x) { return x.id === S.detail.id; })[0];
    h += '<div class="row"><span class="chip on" style="cursor:default">心理科普</span></div>';
    h += '<div class="h">'+a.title+'</div><div class="sub">'+a.intro+"</div>";
    a.sections.forEach(function (sec) { h += '<div class="card col"><div class="sub" style="font-weight:700;color:var(--ink)">'+sec.h+"</div>"+lis(sec.items,"var(--brand)")+"</div>"; });
    h += '<div class="mut">科普内容不能替代专业评估。持续困扰请查看「支持 → 求助资源」。</div>';
  }
  return h + "</div>";
}
function detailTitle() {
  var d = S.detail;
  if (d.kind === "story") return STORIES.filter(function (x) { return x.id === d.id; })[0].title;
  if (d.kind === "video") return VIDEOS.filter(function (x) { return x.id === d.id; })[0].title;
  if (d.kind === "sit") return SITUATIONS.filter(function (x) { return x.id === d.id; })[0].title;
  return ARTICLES.filter(function (x) { return x.id === d.id; })[0].title;
}
function render() {
  var title = S.detail ? detailTitle() : TITLES[S.tab];
  var nav = "";
  if (S.detail) nav += '<button class="back" data-act="back" aria-label="返回">'+I(P.back,18)+"</button>";
  nav += "<h1>"+esc(title)+'</h1><span class="capsule">'+I(P.dots,14)+'<span class="div"></span>'+I(P.mini,14)+"</span>";
  document.getElementById("nav").innerHTML = nav;
  var body = S.detail ? viewDetail() : S.tab === "home" ? viewHome() : S.tab === "check" ? viewCheck() : S.tab === "journal" ? viewJournal() : S.tab === "discover" ? viewDiscover() : viewSupport();
  var main = document.getElementById("main");
  main.innerHTML = body;
  if (S.tab === "support" && S.sup === "talk" && !S.detail) {
    main.scrollTop = main.scrollHeight;
    if (S.chatFocus) { var inp = document.getElementById("chatin"); if (inp) inp.focus(); S.chatFocus = false; }
  } else main.scrollTop = 0;
  var tb = "";
  TABS.forEach(function (t) { tb += '<button class="'+(S.tab===t.key&&!S.detail?"on":"")+'" data-act="tab" data-arg="'+t.key+'">'+I(P[t.icon])+"<span>"+t.label+"</span></button>"; });
  document.getElementById("tabbar").innerHTML = tb;
}
function openModule(key) {
  S.detail = null;
  if (key === "check") S.tab = "check";
  else if (key === "journal") S.tab = "journal";
  else if (key === "stories") { S.tab = "discover"; S.disc = "stories"; }
  else if (key === "science") { S.tab = "discover"; S.disc = "science"; }
  else if (key === "talk") { S.tab = "support"; S.sup = "talk"; }
  else if (key === "help") { S.tab = "support"; S.sup = "help"; }
  render();
}
function matchTopic(text) {
  var best = null, bestScore = 0;
  CHAT_TOPICS.forEach(function (t) {
    var score = 0;
    t.kws.forEach(function (k) { if (text.indexOf(k) !== -1) score++; });
    if (score > bestScore) { best = t; bestScore = score; }
  });
  return best;
}
function chatReply(text) {
  var lower = text.toLowerCase();
  if (/不想活|想死|自杀|自伤|伤害自己|割腕|活着没意思|结束生命/.test(lower)) {
    S.chat.lastTopic = null; S.chat.depth = 0;
    return { who:"bot", crisis:true,
      lead:"谢谢你告诉我这些。这句话很重要，我会认真对待。如果你或孩子现在有伤害自己的念头，请现在就行动，不要等待：",
      dos:["立即陪在他身边，不要让他独处，收好危险物品","马上联系家长、学校心理老师或医生，不要替他保密","拨打 12356 心理援助热线；有紧急危险时拨打 120 / 110"],
      follow:"这不是软弱，也不是「想不开」，而是需要专业帮助的时刻。你愿意现在就去联系身边的人吗？" };
  }
  if (/谢谢|感谢|有用|帮到我/.test(lower)) {
    return { who:"bot", lead:"不客气。陪伴本身就是最有力量的支持。之后遇到新的情况，随时回来聊。也记得照顾好你自己的情绪。" };
  }
  if (/^(你好|在吗|hi|hello|您好)[!！。？?]*$/.test(lower)) {
    return { who:"bot", lead:CHAT_GREET[S.role], follow:CHAT_HINT[S.role] };
  }
  var t = matchTopic(lower);
  if (t && t.id === S.chat.lastTopic && S.chat.depth >= 1) t = null;
  if (!t && S.chat.lastTopic && (text.length <= 15 || /嗯|然后|还有|继续|具体|怎么办|呢|吗/.test(lower))) {
    var prev = CHAT_TOPICS.filter(function (x) { return x.id === S.chat.lastTopic; })[0];
    if (prev) { S.chat.depth = 2; return { who:"bot", lead:"我们再往深走一步：", dos:prev.more, follow:"试了之后情况怎么样？随时回来告诉我，我们再调整。" }; }
  }
  if (t) {
    S.chat.lastTopic = t.id; S.chat.depth = 1;
    var sitId = t.sit && t.sit[S.role] ? t.sit[S.role] : null;
    return { who:"bot", lead:t.lead, dos:t.dos, avoid:t.avoid, say:t.say[S.role], follow:t.follow, sit:sitId };
  }
  return { who:"bot", lead:"我听到了，这确实不容易。能多说一点吗：这种情况持续多久了？你最希望改变的是什么？", follow:"也可以点下面的快捷提问，或直接描述一个具体场景，比如「孩子练完回来就发脾气」。" };
}
function chatSend(text) {
  text = String(text || "").trim();
  if (!text || S.chatBusy) return;
  S.chat.msgs.push({ who:"user", text:text });
  if (S.chat.msgs.length > 60) S.chat.msgs = S.chat.msgs.slice(-60);
  S.chatBusy = true; S.chatDraft = ""; S.chatFocus = true;
  render();
  setTimeout(function () {
    S.chat.msgs.push(chatReply(text));
    S.chatBusy = false;
    render();
  }, 550 + Math.random() * 450);
}
document.addEventListener("click", function (e) {
  var el = e.target.closest ? e.target.closest("[data-act]") : null;
  if (!el) return;
  var act = el.getAttribute("data-act"), arg = el.getAttribute("data-arg");
  if (act === "tab") { S.tab = arg; S.detail = null; render(); }
  else if (act === "mod") openModule(arg);
  else if (act === "hmood") { S.mood = +arg; S.tab = "journal"; render(); }
  else if (act === "jmood") { S.mood = +arg; S.saved = false; render(); }
  else if (act === "start") { S.answers = []; S.quiz = 0; render(); }
  else if (act === "opt") { S.answers[S.quiz] = +arg; S.quiz = S.quiz < QUESTIONS.length - 1 ? S.quiz + 1 : QUESTIONS.length; render(); }
  else if (act === "prevq") { S.quiz = S.quiz - 1; render(); }
  else if (act === "retake") { S.answers = []; S.quiz = -1; render(); }
  else if (act === "disc") { S.disc = arg; render(); }
  else if (act === "sup") { S.sup = arg; S.detail = null; render(); }
  else if (act === "role") {
    S.role = arg; S.openSit = null;
    S.chat = { msgs:[{ who:"bot", lead:CHAT_GREET[arg], follow:CHAT_HINT[arg] }], lastTopic:null, depth:0 };
    render();
  }
  else if (act === "sit") { S.openSit = S.openSit === arg ? null : arg; render(); }
  else if (act === "sitdetail") { S.detail = { kind:"sit", id:arg }; render(); }
  else if (act === "story") { S.detail = { kind:"story", id:arg }; render(); }
  else if (act === "video") { S.detail = { kind:"video", id:arg }; render(); }
  else if (act === "article") { S.detail = { kind:"article", id:arg }; render(); }
  else if (act === "back") { S.detail = null; render(); }
  else if (act === "chip") chatSend(arg);
  else if (act === "send") chatSend(S.chatDraft);
  else if (act === "save") {
    var d = new Date();
    S.entries.unshift({ id:Date.now(), date:(d.getMonth()+1)+"/"+d.getDate(), mood:S.mood, worry:S.worry, confidence:S.confidence, note:S.note });
    S.entries = S.entries.slice(0, 14);
    try { localStorage.setItem("xl-entries-v1", JSON.stringify(S.entries)); } catch (err) {}
    S.note = ""; S.saved = true; render();
  }
});
document.addEventListener("input", function (e) {
  var el = e.target, f = el.getAttribute && el.getAttribute("data-field");
  if (!f) return;
  if (f === "chatdraft") { S.chatDraft = el.value; return; }
  if (f === "note") { S.note = el.value; S.saved = false; return; }
  S[f] = +el.value; S.saved = false;
  var out = document.querySelector('[data-out="'+f+'"]');
  if (out) out.textContent = el.value;
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && e.target && e.target.id === "chatin") { e.preventDefault(); chatSend(S.chatDraft); }
});
render();
</script>
</body>
</html>
